name: Test and release plugin

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Verify bundled SDK matches the lockfile
        run: npm run bundle:runner && git diff --exit-code -- index.html
      - run: node --test tests/*.test.cjs

  release:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: plugin-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package and publish the manifest version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(jq -er '.version | select(test("^[0-9]+[.][0-9]+[.][0-9]+$"))' manifest.json)
          tag="v$version"
          source=$GITHUB_SHA
          if git show-ref --tags --verify --quiet "refs/tags/$tag"; then
            source="refs/tags/$tag"
          fi

          asset=ai-assistant-plugin.zip
          git archive --format=zip --output="$asset" "$source" -- manifest.json index.html plugin.js icon.svg README.md
          unzip -t "$asset"
          test "$(unzip -p "$asset" manifest.json | jq -r .version)" = "$version"

          if gh release view "$tag" --json assets,isDraft > "$RUNNER_TEMP/release.json"; then
            if ! jq -e --arg asset "$asset" 'any(.assets[]; .name == $asset and .state == "uploaded" and .size > 0)' "$RUNNER_TEMP/release.json" >/dev/null; then
              gh release upload "$tag" "$asset" --clobber
            fi
            if jq -e '.isDraft' "$RUNNER_TEMP/release.json" >/dev/null; then
              gh release edit "$tag" --draft=false
            fi
          else
            gh release create "$tag" "$asset" --target "$GITHUB_SHA" \
              --title "AI Assistant Plugin $tag" \
              --notes "Download ai-assistant-plugin.zip below and install it from Settings → Plugins in Super Productivity."
          fi
